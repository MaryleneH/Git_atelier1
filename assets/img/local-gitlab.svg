<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="t d" font-family="'Public Sans', 'Segoe UI', system-ui, sans-serif">
  <title id="t">Votre dépôt et sa copie sur GitLab</title>
  <desc id="d">À gauche, le dépôt dans votre service Onyxia ; à droite, sa copie sur GitLab, avec les mêmes commits et les mêmes empreintes. git push envoie les commits que GitLab n'a pas encore.</desc>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#5b4a8a"/>
    </marker>
  </defs>

  <rect x="20" y="30" width="460" height="320" rx="18" fill="#ffffff" stroke="#e6e1d6" stroke-width="3"/>
  <text x="250" y="72" text-anchor="middle" font-size="26" font-weight="700" fill="#211d18">Votre service Onyxia</text>
  <text x="250" y="100" text-anchor="middle" font-size="18" fill="#8a8377">éphémère</text>

  <rect x="720" y="30" width="460" height="320" rx="18" fill="#efecf7" stroke="#5b4a8a" stroke-width="3"/>
  <text x="950" y="72" text-anchor="middle" font-size="26" font-weight="700" fill="#5b4a8a">GitLab</text>
  <text x="950" y="100" text-anchor="middle" font-size="18" fill="#5b4a8a">au bureau, visible par l'équipe</text>

  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18">
    <rect x="80" y="130" width="340" height="44" rx="8" fill="#1a1723"/>
    <text x="250" y="158" text-anchor="middle" fill="#7ee2b8">1bf7093 Ignore les données…</text>
    <rect x="80" y="190" width="340" height="44" rx="8" fill="#1a1723"/>
    <text x="250" y="218" text-anchor="middle" fill="#c9c4da">aeb8f7c Abaisse le seuil…</text>
    <rect x="80" y="250" width="340" height="44" rx="8" fill="#1a1723"/>
    <text x="250" y="278" text-anchor="middle" fill="#c9c4da">ce80dfb Initialise le suivi…</text>

    <rect x="780" y="130" width="340" height="44" rx="8" fill="#1a1723"/>
    <text x="950" y="158" text-anchor="middle" fill="#7ee2b8">1bf7093 Ignore les données…</text>
    <rect x="780" y="190" width="340" height="44" rx="8" fill="#1a1723"/>
    <text x="950" y="218" text-anchor="middle" fill="#c9c4da">aeb8f7c Abaisse le seuil…</text>
    <rect x="780" y="250" width="340" height="44" rx="8" fill="#1a1723"/>
    <text x="950" y="278" text-anchor="middle" fill="#c9c4da">ce80dfb Initialise le suivi…</text>
  </g>

  <line x1="490" y1="200" x2="708" y2="200" stroke="#5b4a8a" stroke-width="4" marker-end="url(#fl)"/>
  <text x="600" y="185" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="22" font-weight="600" fill="#5b4a8a">push</text>
  <text x="600" y="235" text-anchor="middle" font-size="17" fill="#575046">mêmes commits,</text>
  <text x="600" y="257" text-anchor="middle" font-size="17" fill="#575046">mêmes empreintes</text>

  <text x="950" y="330" text-anchor="middle" font-size="17" fill="#5b4a8a" font-style="italic">+ une interface web : historique, diffs, README</text>
</svg>

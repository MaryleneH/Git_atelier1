<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d" font-family="'Public Sans', 'Segoe UI', system-ui, sans-serif">
  <title id="t">Le panneau Source Control de VS Code (schéma)</title>
  <desc id="d">Schéma du panneau Source Control : une zone de message, un bouton Commit, la liste Staged Changes qui correspond à la zone de sélection, et la liste Changes qui correspond au répertoire de travail. Le bouton plus d'un fichier équivaut à git add.</desc>

  <!-- Panneau -->
  <rect x="20" y="20" width="560" height="480" rx="14" fill="#262231"/>
  <text x="44" y="60" font-size="17" font-weight="700" fill="#c9c4da" letter-spacing="2">SOURCE CONTROL</text>
  <rect x="44" y="80" width="512" height="44" rx="6" fill="#1a1723" stroke="#3a3448" stroke-width="2"/>
  <text x="60" y="108" font-size="17" fill="#aca6c2">Abaisse le seuil de dépendance défense à 10 %</text>
  <rect x="44" y="136" width="512" height="42" rx="6" fill="#0f766e"/>
  <text x="300" y="163" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">✓ Commit</text>

  <text x="44" y="220" font-size="16" font-weight="700" fill="#e8e5f0">⌄ Staged Changes</text>
  <rect x="44" y="232" width="512" height="40" rx="6" fill="#1a1723"/>
  <text x="64" y="258" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" fill="#e8e5f0">02_nettoyage.R</text>
  <text x="520" y="258" font-size="17" font-weight="700" fill="#f5d76e">M</text>

  <text x="44" y="322" font-size="16" font-weight="700" fill="#e8e5f0">⌄ Changes</text>
  <rect x="44" y="334" width="512" height="40" rx="6" fill="#1a1723"/>
  <text x="64" y="360" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" fill="#e8e5f0">README.md</text>
  <text x="486" y="361" font-size="22" font-weight="700" fill="#7ee2b8">+</text>
  <text x="520" y="360" font-size="17" font-weight="700" fill="#f5d76e">M</text>
  <rect x="44" y="382" width="512" height="40" rx="6" fill="#1a1723"/>
  <text x="64" y="408" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" fill="#e8e5f0">brouillon_test.R</text>
  <text x="486" y="409" font-size="22" font-weight="700" fill="#7ee2b8">+</text>
  <text x="520" y="408" font-size="17" font-weight="700" fill="#7ee2b8">U</text>

  <!-- Légendes -->
  <g font-size="20" fill="#211d18">
    <line x1="580" y1="150" x2="650" y2="150" stroke="#0f766e" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="660" y="157"><tspan font-weight="700">Commit</tspan> = <tspan font-family="'JetBrains Mono', ui-monospace, monospace" fill="#0b5952">git commit -m "…"</tspan></text>

    <line x1="580" y1="245" x2="650" y2="245" stroke="#0f766e" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="660" y="252"><tspan font-weight="700">Staged Changes</tspan> = la zone de sélection</text>

    <line x1="580" y1="355" x2="650" y2="355" stroke="#0f766e" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="660" y="340"><tspan font-weight="700">Changes</tspan> = le répertoire de travail</text>
    <text x="660" y="372">le <tspan font-weight="700" fill="#0f766e">+</tspan> = <tspan font-family="'JetBrains Mono', ui-monospace, monospace" fill="#0b5952">git add</tspan></text>

    <text x="660" y="450" fill="#575046">un clic sur un fichier = le diff, côte à côte</text>
    <text x="660" y="478" fill="#8a8377" font-size="16">M : modifié · U : non suivi (untracked)</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="t d" font-family="'Public Sans', 'Segoe UI', system-ui, sans-serif">
  <title id="t">Où range-t-on quoi ?</title>
  <desc id="d">Le code et la documentation vont dans Git, sur GitLab. Les données restent sur le stockage S3, au format Parquet, et les scripts les lisent par leur chemin. Les sorties, rapport HTML et figures, sont régénérées par les scripts et ne sont pas versionnées.</desc>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#575046"/>
    </marker>
  </defs>

  <!-- Git -->
  <rect x="400" y="30" width="400" height="230" rx="18" fill="#e4f2f0" stroke="#0f766e" stroke-width="3"/>
  <text x="600" y="72" text-anchor="middle" font-size="28" font-weight="700" fill="#0b5952">Git · GitLab</text>
  <text x="600" y="102" text-anchor="middle" font-size="19" fill="#0b5952">le code et la documentation</text>
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" fill="#211d18">
    <text x="600" y="145" text-anchor="middle">scripts/   rapport.qmd</text>
    <text x="600" y="175" text-anchor="middle">README.md  .gitignore</text>
  </g>
  <text x="600" y="228" text-anchor="middle" font-size="17" fill="#575046" font-style="italic">du texte, léger, lisible en diff</text>

  <!-- Données -->
  <rect x="20" y="300" width="400" height="140" rx="18" fill="#ffffff" stroke="#5b4a8a" stroke-width="3"/>
  <text x="220" y="342" text-anchor="middle" font-size="26" font-weight="700" fill="#5b4a8a">Stockage S3 · Parquet</text>
  <text x="220" y="372" text-anchor="middle" font-size="19" fill="#575046">les données</text>
  <text x="220" y="410" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" fill="#211d18">s3://…/bitd_2024.parquet</text>

  <!-- Sorties -->
  <rect x="780" y="300" width="400" height="140" rx="18" fill="#fdf3e3" stroke="#f59e0b" stroke-width="3"/>
  <text x="980" y="342" text-anchor="middle" font-size="26" font-weight="700" fill="#b45309">Sorties régénérées</text>
  <text x="980" y="372" text-anchor="middle" font-size="19" fill="#575046">refaites à la demande</text>
  <text x="980" y="410" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" fill="#211d18">rapport.html  figures/</text>

  <!-- Flèches -->
  <path d="M420 350 C500 350, 520 300, 520 266" fill="none" stroke="#575046" stroke-width="3" marker-end="url(#fl)"/>
  <text x="210" y="255" text-anchor="middle" font-size="18" fill="#575046">les scripts lisent</text>
  <text x="210" y="277" text-anchor="middle" font-size="18" fill="#575046">les données par leur chemin</text>
  <path d="M680 266 C680 300, 700 350, 774 350" fill="none" stroke="#575046" stroke-width="3" marker-end="url(#fl)"/>
  <text x="990" y="255" text-anchor="middle" font-size="18" fill="#575046">les scripts produisent</text>
  <text x="990" y="277" text-anchor="middle" font-size="18" fill="#575046">les sorties</text>
</svg>
